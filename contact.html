<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Shubham Dhadiwal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">SD<span>.</span></div>
            <ul class="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="experience.html">Experience</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="contact-section container">
        <div class="section-title">
            <span class="badge">Connect</span>
            <h2>Get In <span>Touch</span></h2>
            <p>Available for <strong>freelancing</strong>, <strong>full-time jobs</strong>, and <strong>M365 consulting</strong>.</p>
        </div>

        <div class="contact-grid">
            <div class="contact-info">
                <div class="detail-card">
                    <p><i class="fas fa-envelope"></i> Shubham.Dhadiwal@outlook.com</p>
                    <p style="margin-top:10px;"><i class="fas fa-phone"></i> +91 70200 86337</p>
                </div>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <input type="text" placeholder="Name" required>
                    <input type="email" placeholder="Email" required>
                </div>
                <textarea rows="4" placeholder="How can I help you?" required></textarea>
                <button type="submit" class="btn-submit">Send Message <i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
