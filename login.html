<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SD Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#f2f2f2; display:flex; align-items:center; justify-content:center; height:100vh;">
    <div style="background:white; padding:40px; width:100%; max-width:420px; box-shadow:0 15px 35px rgba(0,0,0,0.1); border-radius:2px;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Microsoft_logo_%282012%29.svg/1280px-Microsoft_logo_%282012%29.svg.png" width="110">
        <h2 style="color:#000; margin:20px 0 10px; font-weight:600;">Sign in</h2>
        <p style="color:#666; font-size:15px; margin-bottom:20px;">Use your Client ID to access project files.</p>
        <input type="text" id="uid" placeholder="User ID" style="width:100%; padding:12px; margin-bottom:15px; border:none; border-bottom:1px solid #666; font-size:16px;">
        <input type="password" id="ups" placeholder="Password" style="width:100%; border:none; border-bottom:1px solid #666; padding:12px; margin-bottom:30px; font-size:16px;">
        <button onclick="login()" style="background:#0067b8; color:white; border:none; padding:10px 35px; cursor:pointer; font-weight:600; float:right;">Sign In</button>
    </div>
    <script>
        function login() {
            const u = document.getElementById('uid').value;
            const p = document.getElementById('ups').value;
            if(u === "client" && p === "shubham365") {
                window.location.href = "https://1drv.ms/f/c/6e2da3a833e15004/IgAEUOEzqKMtIIBuRAEAAAAAAads1YT_Yygv2Kubec9bhBw";
            } else { alert("Access Denied."); }
        }
    </script>
</body>
</html>
