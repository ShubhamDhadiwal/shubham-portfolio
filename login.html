<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal | SD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #f2f2f2; color: #000;">
    <nav class="navbar"><div class="container">
        <a href="index.html" class="logo">SD<span>.</span></a>
    </div></nav>

    <div style="background: white; padding: 40px; max-width: 400px; margin: 120px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 4px;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Microsoft_logo_%282012%29.svg/1280px-Microsoft_logo_%282012%29.svg.png" width="110">
        <h2 style="margin: 20px 0 5px; font-size: 24px;">Sign in</h2>
        <p style="font-size: 14px; margin-bottom: 20px;">Access your shared M365 project files.</p>
        
        <input type="text" id="uid" placeholder="User ID" style="width:100%; border:none; border-bottom:1px solid #666; padding:10px; margin-bottom:15px; outline:none; font-size:16px;">
        <input type="password" id="ups" placeholder="Password" style="width:100%; border:none; border-bottom:1px solid #666; padding:10px; margin-bottom:20px; outline:none; font-size:16px;">
        
        <button onclick="checkPortal()" style="background:#0067b8; color:white; border:none; padding:10px 35px; cursor:pointer; font-weight:600; float:right;">Sign in</button>
        <div style="clear:both;"></div>
    </div>

    <script>
        function checkPortal() {
            const u = document.getElementById('uid').value;
            const p = document.getElementById('ups').value;
            // Your OneDrive Link
            const link = "https://1drv.ms/f/c/6e2da3a833e15004/IgAEUOEzqKMtIIBuRAEAAAAAAads1YT_Yygv2Kubec9bhBw";
            
            if(u === "client" && p === "shubham365") {
                window.location.href = link;
            } else {
                alert("Incorrect Credentials. Access Denied.");
            }
        }
    </script>
</body>
</html>
